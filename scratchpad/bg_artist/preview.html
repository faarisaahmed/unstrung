<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000;color:#ccc;font:12px sans-serif}#g{display:grid;grid-template-columns:repeat(4,480px);gap:0}div.c{position:relative}span{position:absolute;left:4px;top:2px;color:#fff;text-shadow:0 0 2px #000}</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="g"></div>
<script type="module">
const q = new URLSearchParams(location.search);
const v = Date.now();
const { getBackground, drawBackground } = await import('../../src/art/backgrounds.js?v=' + v);
const { STYLES } = await import('../../src/art/palettes.js');
const areas = (q.get('areas') || Object.keys(STYLES).join(',')).split(',');
const camX = +(q.get('x') || 700), ty = +(q.get('y') || 0.5);
const scale = +(q.get('s') || 0.5);
const times = {};
for (const a of areas) {
  const st = STYLES[a];
  const t0 = performance.now();
  const bg = getBackground(a, st);
  times[a] = Math.round(performance.now() - t0);
  const cv = document.createElement('canvas'); cv.width = 960; cv.height = 540;
  const ctx = cv.getContext('2d');
  drawBackground(ctx, bg, camX, ty * 1000, 3000, 1540, 1.0);
  cv.style.width = 960 * scale + 'px';
  const d = document.createElement('div'); d.className = 'c'; d.appendChild(cv);
  const s = document.createElement('span'); s.textContent = a + ' ' + st.bg + ' ' + times[a] + 'ms'; d.appendChild(s);
  document.getElementById('g').appendChild(d);
}
if (scale !== 0.5) document.getElementById('g').style.gridTemplateColumns = `repeat(${Math.max(1, Math.floor(1920 / (960 * scale)))}, ${960 * scale}px)`;
window.__times = times; window.__done = true;
</script></body></html>
