<!doctype html><meta charset="utf-8"><title>sheet</title>
<style>body{margin:0;background:#2a2630}</style>
<canvas id="c"></canvas>
<script type="module">
import { PAINTERS } from '../../src/art/creatures.js';
import { ENEMY_LIST } from '../../src/data/enemies/index.js';
const q = new URLSearchParams(location.search);
const area = q.get('area'), body = q.get('body');
let list = ENEMY_LIST.filter(e => (!area || e.area === area) && (!body || e.art.body === body));
if (q.get('bodies')) { const seen = new Set(); list = ENEMY_LIST.filter(e => !seen.has(e.art.body) && seen.add(e.art.body)); }
const cols = +(q.get('cols') || 6), CW = +(q.get('cw') || 200), CH = +(q.get('ch') || 170);
const T = +(q.get('t') || 1.3), flash = q.get('flash');
const cv = document.getElementById('c');
cv.width = cols * CW; cv.height = Math.ceil(list.length / cols) * CH;
const ctx = cv.getContext('2d');
const bgs = ['#3b4a48', '#5a5446', '#2c3242', '#6d6a60'];
const game = { player: { cx: 9999, cy: 0 } };
list.forEach((d, i) => {
  const x = (i % cols) * CW, y = Math.floor(i / cols) * CH;
  ctx.fillStyle = bgs[(i + Math.floor(i / cols)) % 4]; ctx.fillRect(x, y, CW, CH);
  const [w, h] = d.size || [28, 24];
  const scale = Math.min(2.6 * (+q.get('z') || 1), 110 * (+q.get('z') || 1) / Math.max(w, h));
  const fake = { w, h, anim: T + i * 0.37, state: q.get('state') || 'idle', facing: 1, game, grounded: true, cx: 0, cy: 0, x: 0, y: 0, emerge: 1, roll: T * 2 };
  ctx.save(); ctx.translate(x + CW / 2, y + (d.art.centered ? CH * 0.5 : CH - 22)); ctx.scale(scale, scale);
  try { PAINTERS[d.art.body](ctx, fake, T, flash ? Object.assign({}, d.art, {c1:'#ffffff',c2:'#ffffff',c3:'#ffffff'}) : d.art); } catch (err) { console.error(d.id, err.message); }
  ctx.restore();
  ctx.fillStyle = '#eee'; ctx.font = '11px sans-serif'; ctx.fillText(d.id + ' [' + d.art.body + ']', x + 4, y + 12);
});
document.title = 'done';
</script>
